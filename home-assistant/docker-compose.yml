version: "3.9"

# PRD 10장 권장안 A(Home Assistant 로컬 허브)의 최소 실행 구성.
# 오픈 이슈 Q4/Q6/Q10 은 ../docs/ASSUMPTIONS.md 의 샘플 값(미니PC 허브,
# VLAN 지원 공유기+Synology NAS, SmartThings Station 2023 + Nest Hub 2세대의
# Thread BR 재사용)을 임시로 가정해 아래 구성을 작성했다. 실제 하드웨어가
# 확정되면 이 파일과 ASSUMPTIONS.md를 함께 갱신한다.
#
# 기동:
#   cp .env.example .env  # 값 채우기
#   cp config/secrets.yaml.example config/secrets.yaml  # 값 채우기 (Git에 커밋 금지)
#   docker compose up -d

services:
  homeassistant:
    image: ghcr.io/home-assistant/home-assistant:stable
    container_name: ha-core
    restart: unless-stopped
    network_mode: host # mDNS/SSDP 기기 탐지(FR-02), Matter/Cast 로컬 통합에 필요
    privileged: true # Bluetooth(SwitchBot Curtain 3 BLE, 샘플 Q1) 및 USB Zigbee 코디네이터 접근용
    volumes:
      - ./config:/config
      - /run/dbus:/run/dbus:ro
    environment:
      - TZ=Asia/Seoul

  mosquitto:
    image: eclipse-mosquitto:2
    container_name: ha-mosquitto
    restart: unless-stopped
    ports:
      - "1883:1883"
    volumes:
      - ./mosquitto/config:/mosquitto/config
      - ./mosquitto/data:/mosquitto/data
      - ./mosquitto/log:/mosquitto/log

  zigbee2mqtt:
    image: koenkk/zigbee2mqtt:latest
    container_name: ha-zigbee2mqtt
    restart: unless-stopped
    depends_on:
      - mosquitto
    volumes:
      - ./zigbee2mqtt/data:/app/data
      - /run/udev:/run/udev:ro
    devices:
      # 커튼은 SwitchBot(BLE)로 샘플 확정했으므로 Zigbee는 공통 센서(온습도/
      # 문열림 등, §4.1)용으로만 쓴다. 샘플: Sonoff Zigbee 3.0 USB Dongle Plus.
      # 실제 장치 연결 후 `ls /dev/serial/by-id/`로 확인해 교체.
      - /dev/serial/by-id/usb-ITead_Sonoff_Zigbee_3.0_USB_Dongle_Plus_SAMPLE:/dev/ttyACM0
    environment:
      - TZ=Asia/Seoul

  matter-server:
    # HA 2026-06 Matter 통합(matter.js 기반)이 의존하는 별도 서버.
    # IR-01(Matter 우선 원칙), IR-02(멀티어드민)의 실행 기반.
    image: ghcr.io/home-assistant-libs/python-matter-server:stable
    container_name: ha-matter-server
    restart: unless-stopped
    network_mode: host
    volumes:
      - ./matter-server/data:/data
    command: --storage-path /data

# Thread Border Router(OTBR): 샘플 결정(Q4)에 따라 SmartThings Station(2023)과
# Nest Hub(2세대)가 이미 Thread BR을 내장했다고 가정하고, 별도 OTBR 컨테이너는
# 이 compose에 포함하지 않는다. HA `thread` 통합이 두 기기가 광고하는 기존
# Thread 네트워크를 자동 탐지한다는 전제이며, 실제로 탐지되지 않으면 RCP 동글
# 기반 OTBR 컨테이너를 추가해야 한다.
